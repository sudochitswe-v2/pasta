<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Pasta — Remote Paste</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Pasta</h1>
    <span id="status" class="status unknown" title="Host reachability"><span class="dot"></span><span id="status-text">…</span></span>
  </header>

  <label class="sr" for="text">Text to paste</label>
  <textarea id="text" rows="8" placeholder="Type or paste text to stealth-type…" autofocus autocomplete="off" autocapitalize="sentences"></textarea>

  <div class="stealth-badge" title="Stealth Mode: Raw hardware keystrokes (clipboard is never touched)">
    <span class="stealth-icon">🔒</span>
    <span>Stealth Mode (Hardware Keystrokes)</span>
  </div>

  <div class="action-row">
    <button id="send" type="button">Send&nbsp;⏎</button>
    <button id="btn-screenshot" type="button" class="btn-shot" title="Capture remote screen and copy to clipboard">Screenshot</button>
  </div>
  <p class="hint" id="hint">Ctrl+Enter to send · typed directly as hardware keystrokes (no clipboard)</p>
</main>

<div id="shot-modal" class="shot-modal" hidden>
  <div class="shot-card">
    <div class="shot-header">
      <span class="shot-title">Remote Screenshot</span>
      <button id="shot-close" type="button" class="shot-close" aria-label="Close preview">✕</button>
    </div>
    <div class="shot-preview" id="shot-preview">
      <img id="shot-img" alt="Captured screen preview">
    </div>
    <p id="shot-hint" class="shot-hint">Touch &amp; hold image to Copy or Save</p>
    <div class="shot-actions">
      <button id="shot-copy" type="button" class="btn-action">Copy Image</button>
      <button id="shot-share" type="button" class="btn-action" hidden>Share</button>
      <a id="shot-dl" download="screenshot.png" class="btn-action btn-dl">Download</a>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
