<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Pasta — Remote Paste</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Pasta</h1>
    <span id="status" class="status unknown" title="Host reachability"><span class="dot"></span><span id="status-text">…</span></span>
  </header>

  <label class="sr" for="text">Text to paste</label>
  <textarea id="text" rows="8" placeholder="Type or paste text here…" autofocus autocomplete="off" autocapitalize="sentences"></textarea>

  <div class="mode" role="group" aria-label="Send mode">
    <button id="mode-paste" type="button" class="active" aria-pressed="true">Fast Paste</button>
    <button id="mode-type" type="button" aria-pressed="false">Stealth Type</button>
  </div>

  <button id="send" type="button">Send&nbsp;⏎</button>
  <p class="hint" id="hint">Ctrl+Enter to send · text appears at the host cursor</p>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
